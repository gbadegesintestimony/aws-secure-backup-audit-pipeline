<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <!-- Drop shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Title & Badge -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">AWS Secure Backup &amp; Audit Pipeline Architecture</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#64748b">Private EC2 automated backups to S3 with event-driven serverless audit logging</text>

  <!-- 1. Administrator -->
  <g transform="translate(30, 110)">
    <rect width="130" height="90" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="65" cy="35" r="14" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5" />
    <path d="M 47 62 C 47 48, 83 48, 83 62 Z" fill="#94a3b8" />
    <text x="65" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Administrator</text>
    <text x="65" y="88" text-anchor="middle" font-size="10" fill="#64748b">Allowed IP only</text>
  </g>

  <!-- Flow 1: Admin to Bastion -->
  <path d="M 160 155 L 232 155" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="165" y="132" width="62" height="18" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="196" y="145" text-anchor="middle" font-size="9" font-weight="500" fill="#334155">SSH :22</text>

  <!-- AWS VPC Container -->
  <rect x="220" y="75" width="460" height="435" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2" stroke-dasharray="6,4" />
  <rect x="235" y="85" width="165" height="22" rx="4" fill="#a855f7" />
  <text x="317" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">AWS VPC · 10.0.0.0/16</text>

  <!-- Public Subnet -->
  <rect x="240" y="118" width="190" height="110" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5" />
  <text x="250" y="136" font-size="11" font-weight="700" fill="#0f766e">Public Subnet</text>
  
  <!-- Bastion EC2 -->
  <g transform="translate(255, 146)">
    <rect width="160" height="70" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="8" y="10" width="22" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
    <text x="19" y="25" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">EC2</text>
    <text x="36" y="24" font-size="12" font-weight="600" fill="#1e293b">Bastion Host</text>
    <text x="10" y="44" font-size="10" fill="#64748b">• Public IP assigned</text>
    <text x="10" y="58" font-size="10" fill="#64748b">• Restricted ingress SG</text>
  </g>

  <!-- Flow 2: Bastion to App (Downwards flow) -->
  <path d="M 335 228 L 335 272" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="280" y="240" width="110" height="18" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="335" y="253" text-anchor="middle" font-size="9" font-weight="500" fill="#334155">SSH (Bastion SG only)</text>

  <!-- Private Subnet -->
  <rect x="240" y="278" width="420" height="130" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" />
  <text x="250" y="296" font-size="11" font-weight="700" fill="#b45309">Private Subnet (No Internet / NAT removed)</text>

  <!-- Application EC2 -->
  <g transform="translate(255, 306)">
    <rect width="210" height="90" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="8" y="10" width="22" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
    <text x="19" y="25" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">EC2</text>
    <text x="36" y="24" font-size="12" font-weight="600" fill="#1e293b">Application Server</text>
    <text x="10" y="44" font-size="10" fill="#64748b">• No public IP</text>
    <text x="10" y="58" font-size="10" fill="#64748b">• systemd data-generator</text>
    <text x="10" y="72" font-size="10" fill="#64748b">• Cron backup.sh (every 10m)</text>
  </g>

  <!-- S3 Gateway Endpoint inside VPC -->
  <g transform="translate(490, 316)">
    <rect width="155" height="70" rx="6" fill="#ffffff" stroke="#9333ea" stroke-width="1.5" filter="url(#shadow)" />
    <text x="77" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#6b21a8">S3 Gateway</text>
    <text x="77" y="38" text-anchor="middle" font-size="11" font-weight="700" fill="#6b21a8">VPC Endpoint</text>
    <text x="77" y="56" text-anchor="middle" font-size="9" fill="#7e22ce">Route Table Prefix-List</text>
  </g>

  <!-- Flow 3: App EC2 to S3 Endpoint -->
  <path d="M 465 351 L 482 351" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <rect x="440" y="328" width="60" height="16" rx="3" fill="#ffffff" stroke="#bbf7d0" stroke-width="1" />
  <text x="470" y="340" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">s3:PutObject</text>

  <!-- Flow 4: S3 Endpoint to S3 Bucket -->
  <path d="M 645 351 L 712 351" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <rect x="652" y="330" width="55" height="16" rx="3" fill="#ffffff" stroke="#bbf7d0" stroke-width="1" />
  <text x="679" y="342" text-anchor="middle" font-size="8" font-weight="600" fill="#15803d">Private Path</text>

  <!-- S3 Bucket (Cylinder Representation) -->
  <g transform="translate(720, 295)">
    <!-- Main body -->
    <path d="M 0 20 L 0 85 A 65 18 0 0 0 130 85 L 130 20 Z" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)" />
    <!-- Bottom ellipse -->
    <ellipse cx="65" cy="85" rx="65" ry="18" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <!-- Top ellipse -->
    <ellipse cx="65" cy="20" rx="65" ry="18" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5" />
    <text x="65" y="44" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Amazon S3</text>
    <text x="65" y="58" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">backups/*</text>
    <text x="65" y="72" text-anchor="middle" font-size="9" fill="#15803d">Private Bucket</text>
  </g>

  <!-- Flow 5: S3 to Lambda (Upwards flow) -->
  <path d="M 785 295 L 785 208" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <rect x="730" y="238" width="110" height="26" rx="3" fill="#ffffff" stroke="#fed7aa" stroke-width="1" />
  <text x="785" y="250" text-anchor="middle" font-size="9" font-weight="600" fill="#c2410c">S3 Event Trigger</text>
  <text x="785" y="260" text-anchor="middle" font-size="8" fill="#9a3412">ObjectCreated:Put</text>

  <!-- AWS Lambda Function -->
  <g transform="translate(710, 120)">
    <rect width="150" height="80" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="10" y="10" width="22" height="22" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1" />
    <text x="21" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">λ</text>
    <text x="38" y="25" font-size="12" font-weight="600" fill="#1e293b">AWS Lambda</text>
    <text x="10" y="46" font-size="10" font-weight="500" fill="#334155">karatu-backup-audit</text>
    <text x="10" y="60" font-size="9" fill="#64748b">• Parses S3 event</text>
    <text x="10" y="72" font-size="9" fill="#64748b">• Writes audit log</text>
  </g>

  <!-- Flow 6: Lambda to DynamoDB (Upwards or rightwards flow) -->
  <path d="M 785 120 L 785 70 L 690 70" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <rect x="695" y="55" width="85" height="16" rx="3" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
  <text x="737" y="66" text-anchor="middle" font-size="8" font-weight="600" fill="#1d4ed8">dynamodb:PutItem</text>

  <!-- DynamoDB Table (Top right, above Lambda or next to it) -->
  <g transform="translate(540, 25)">
    <!-- Container -->
    <rect width="145" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)" />
    <text x="72" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Amazon DynamoDB</text>
    <text x="72" y="37" text-anchor="middle" font-size="10" font-weight="600" fill="#2563eb">Table: backup-log</text>
    <text x="72" y="51" text-anchor="middle" font-size="9" fill="#64748b">Partition Key: backup_id</text>
  </g>

  <!-- Security callouts / legend at bottom -->
  <g transform="translate(40, 480)">
    <text x="0" y="15" font-size="10" font-weight="700" fill="#475569">Key Security Controls:</text>
    <rect x="130" y="2" width="160" height="18" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="210" y="14" text-anchor="middle" font-size="9" fill="#334155">🔒 No Public IP on App EC2</text>

    <rect x="300" y="2" width="180" height="18" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="390" y="14" text-anchor="middle" font-size="9" fill="#334155">🔒 Instance IAM Role (PutObject only)</text>

    <rect x="490" y="2" width="185" height="18" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="582" y="14" text-anchor="middle" font-size="9" fill="#334155">🔒 Gateway Endpoint (No NAT Gateways)</text>

    <rect x="685" y="2" width="180" height="18" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="775" y="14" text-anchor="middle" font-size="9" fill="#334155">🔒 Event-Driven Audit Trail</text>
  </g>
</svg>
